components:
  schemas:
    Session:
      type: object
      required:
        - activityId
        - locationId
        - trainerId
        - dateSession
        - timeSession
        - duration
        - availability
      properties:
        id:
          type: number
          example: 1
        activityId:
          type: number
          example: 1
        locationId:
          type: number
          example: 1
        trainerId:
          type: number
          example: 10.00
        dateSession:
          type: string
          format: date
          example: "2026-11-04"
        timeSession:
          type: string
          example: "09:00:00"
        duration:
          type: number
          example: 60
        availability:
          type: number
          example: 10
    SessionDetails:
      type: object
      required:
        - session
        - activity
        - location
        - trainer
      properties:
        session:
          $ref: "#/components/schemas/Session"
        activity:
          type: object
          properties:
            id:
              type: number
              example: 1
            activityName:
              type: string
              example: "Pilates"
        location:
          type: object
          properties:
            id:
              type: number
              example: 1
            locationName:
              type: string
              example: "Ashgrove"
        trainer:
          $ref: "#/components/schemas/User"
    UserCredentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: "bokatan@member.com"
        password:
          type: string
          example: "Password1"
    AuthenticationKey:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          format: uuid
    User:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - role
      properties:
        id:
          type: number
          example: 1
        firstName:
          type: string
          example: "Hans"
        lastName:
          type: string
          example: "Solo"
        email:
          type: string
          example: "hsolo@example.com"
        role:
          type: string
          example: "member"
          enum: [admin, trainer, member]
    UserRegistration:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
        - confirmPassword
      properties:
        firstName:
          type: string
          example: "Bo"
        lastName:
          type: string
          example: "Katan"
        email:
          type: string
          format: email
          example: "bo.katan@member.com"
        password:
          type: string
          format: password
          example: "Password1"
        confirmPassword:
          type: string
          format: password
          example: "Password1"
    Booking:
      type: object
      required:
        - sessionId
      properties:
        id:
          type: number
          example: 1
        userId:
          type: number
          example: 1
        sessionId:
          type: number
          example: 1
        bookingStatus:
          type: string
          example: "confirmed"
          enum:
            - confirmed
            - cancelled
        deleted:
          type: number
          example: 0
    BookingDetails:
      type: object
      required:
        - booking
        - session
        - activity
        - location
        - trainer
        - member
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        session:
          $ref: "#/components/schemas/Session"
        activity:
          type: object
          properties:
            id:
              type: number
              example: 1
            activityName:
              type: string
              example: "Yoga"
        location:
          type: object
          properties:
            id:
              type: number
              example: 1
            locationName:
              type: string
              example: "Ashgrove"
        trainer:
          $ref: "#/components/schemas/User"
        member:
          $ref: "#/components/schemas/User"
    BlogPost:
      type: object
      required:
        - title
        - content
      properties:
        id:
          type: number
          example: 1
        title:
          type: string
          example: "Five tips for Beskar conditioning"
        content:
          type: string
          example: "Build Mandalorian level endurance with controlled strength training, proper hydration and enough recovery between missions."
        userId:
          type: number
          example: 1
        dateCreated:
          type: string
          format: date-time
        deleted:
          type: number
          example: 0
    BlogPostDetails:
      type: object
      required:
        - blogPost
        - user
      properties:
        blogPost:
          $ref: "#/components/schemas/BlogPost"
        user:
          $ref: "#/components/schemas/User"
  responses:
    LoginSuccessful:
      description: "The user was successfully logged in"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthenticationKey"
    LogoutSuccessful:
      description: "The user was successfully logged out"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Deauthentication successful"
    Updated:
      description: "A record was updated"
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Record updated"
    Created:
      description: "A new record was created"
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - message
            properties:
              id:
                type: number
                example: 1
              message:
                type: string
                example: "Record created"
    BlogPostCreated:
      description: "The blog post was created successfully"
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - message
            properties:
              id:
                type: number
                example: 1
              message:
                type: string
                example: "Blog post created"
    BlogPostDeleted:
      description: "The blog post was deleted successfully"
      content:
        application/json:
          schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: "Blog post deleted"
    NotFound:
      description: "Record not found"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Record not found"
    BlogPostNotFound:
      description: "The blog post that has been requested could not be found"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Blog post not found"
    
    Error:
      description: "An error has occurred"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Something went wrong"
    Unauthorised:
      description: "The user needs to log in and be authenticated to access this"
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Not authenticated"
    ValidationError:
      description: "The details entered did not meet the requirements to be validated"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Please enter valid information."          
    LogoutUnauthorised:
      description: "The user must be logged in before being able to log out"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Please login to access the requested resource"
    InvalidCredentials:
      description: "The email address and/or password entered is incorrect"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Invalid credentials"
    Forbidden:
      description: "The authenticated user does not have the required role permissions to access this"
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Access forbidden"
    BlogDeleteForbidden:
      description: "The user cannot delete another users blog post"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "You can only delete your own blog posts"
    ServerError:
      description: "This request could not be completed due to a server error."
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Failed to process the request"
    LogoutServerError:
      description: "There was a server error and the user could not be logged out"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Failed to deauthenticate user"
    AuthenticationServerError:
      description: "There was a server error and the user could not be authenticated"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Failed to authenticate user"
    BlogPostValidationError:
      description: "The blog post title or content did not meet the requirements to be validated"
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Please enter a title between 1 and 100 characters. Do not use these characters: \" * : < > ? / \\ | { }."

    BlogCreateServerError:
      description: "There was a server error and the blog post could not be created."
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Failed to create blog post"

    BlogPostLoadError:
      description: "There was a server error and the blog posts could not be loaded."
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Failed to load blog posts from database"
    BlogDeleteError:
      description: "There was a server error and the blog post could not be deleted."
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "Failed to delete blog post"



